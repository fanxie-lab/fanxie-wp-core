name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous in-flight runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum required — no write scope anywhere in this workflow.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PHPCS + PHPStan across the supported PHP matrix.
  # ---------------------------------------------------------------------------
  php-quality:
    name: PHP Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, dom, libxml
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      # Ignore PHP platform reqs: composer.lock pins PHPUnit 12 (requires PHP
      # 8.3). PHPCS + PHPStan themselves run fine on 8.1/8.2, and we never
      # invoke PHPUnit in this job — so skipping the platform check is safe and
      # keeps static-analysis coverage across the full supported PHP matrix.
      # PHPUnit runs in the dedicated `php-tests` job on PHP 8.3 only.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=php

      - name: PHPCS (WordPress-Extra + WP-Docs + PHPCompatibilityWP)
        run: composer run phpcs

      - name: PHPStan (level 8)
        run: composer run phpstan

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## PHP quality failed on PHP ${{ matrix.php }}"
            echo ""
            echo "Re-run locally:"
            echo ""
            echo '```bash'
            echo "composer install"
            echo "composer run check"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # PHPUnit inside wp-env (Docker), against WordPress latest + trunk.
  # ---------------------------------------------------------------------------
  php-tests:
    name: PHP Tests (WP ${{ matrix.wp-version }})
    runs-on: ubuntu-latest
    # WP trunk is advisory — wp-env + trunk has intermittent Docker/DB startup
    # flakes unrelated to our code. Don't let a bad trunk run block the branch.
    continue-on-error: ${{ matrix.wp-version == 'trunk' }}
    strategy:
      fail-fast: false
      matrix:
        wp-version: [latest, trunk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Host PHP must match PHPUnit 12's floor (PHP 8.3) for the host-side
      # `composer install` to resolve the lock file. PHPUnit itself runs inside
      # wp-env's Docker container — this version is only for dependency
      # resolution on the runner.
      - name: Setup PHP (host-side, for `composer install`)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, libxml
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php83-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php83-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            assets/admin/package-lock.json

      - name: Install root npm dependencies
        run: npm ci

      - name: Start wp-env
        env:
          WP_ENV_CORE: ${{ matrix.wp-version == 'trunk' && 'WordPress/WordPress#master' || null }}
        run: npm run env:start

      - name: Run PHPUnit (via wp-env tests-cli)
        run: npm run test:php

      - name: Stop wp-env
        if: always()
        run: npm run env:stop

  # ---------------------------------------------------------------------------
  # JS/TS quality — lint, format-check, type-check in the Vue admin workspace.
  # Contract with the frontend agent: `assets/admin/` exposes `npm run check`.
  # ---------------------------------------------------------------------------
  js-quality:
    name: JS Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            assets/admin/package-lock.json

      - name: Install root npm dependencies
        run: npm ci

      - name: Install admin SPA dependencies
        working-directory: assets/admin
        run: npm ci

      - name: Lint + format + type-check (admin SPA)
        working-directory: assets/admin
        run: npm run check

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## JS quality failed"
            echo ""
            echo "Re-run locally:"
            echo ""
            echo '```bash'
            echo "cd assets/admin && npm ci && npm run check"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # WordPress Plugin Check — official action.
  #
  # Fails on errors only; warnings are still reported but don't block CI yet.
  # Pre-release, warnings become a hard fail (tracked in CLAUDE.md §2).
  # ---------------------------------------------------------------------------
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, dom, libxml
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-php81-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php81-

      - name: Install Composer dependencies (plugin requires vendor/ to boot)
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          # Build name that the action scans — it defaults to the repo folder.
          build-dir: '.'
          # Errors block the build. Warnings are still surfaced but tolerated
          # during scaffold phases. Before first public release this flips.
          ignore-warnings: true
          ignore-errors: false
          # Dev-only directories that live in the repo root but are not part of
          # the shipped plugin. Excluding them stops Plugin Check from firing
          # `hidden_files` / `application_detected` errors on .github, tests,
          # docs, and workspace node_modules.
          exclude-directories: '.github,_PRD,docs,tests,node_modules,assets/admin/node_modules,assets/admin/src/modules/__tests__'
          exclude-files: '.gitignore,.prettierrc,.prettierignore,.eslintrc,.editorconfig,.wp-env.json,.wp-env.override.json.example,phpcs.xml.dist,phpstan.neon.dist,phpunit.xml.dist,playwright.config.ts'

  # ---------------------------------------------------------------------------
  # Aggregate gate — one required check for branch protection.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [php-quality, js-quality, plugin-check]
    if: always()
    steps:
      - name: Fail if any required job failed
        if: ${{ needs.php-quality.result != 'success' || needs.js-quality.result != 'success' || needs.plugin-check.result != 'success' }}
        run: |
          echo "One or more required jobs failed."
          echo "php-quality:   ${{ needs.php-quality.result }}"
          echo "js-quality:    ${{ needs.js-quality.result }}"
          echo "plugin-check:  ${{ needs.plugin-check.result }}"
          exit 1

      - name: CI passed
        run: echo "ci passed"
